# Sanitized excerpt from /etc/config/dhcp
# Sensitive identifiers have been intentionally redacted.

config dnsmasq
	option domainneeded '1'
	option boguspriv_old '1'
	option filterwin2k '0'
	option localise_queries '1'
	option rebind_localhost '1'
	option local '/lan/'
	option domain 'lan'
	option expandhosts '1'
	option nonegcache '0'
	option cachesize_old '1000'
	option authoritative '1'
	option readethers '1'
	option leasefile '/tmp/dhcp.leases'
	option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'
	option nonwildcard '1'
	option localservice '1'
	option ednspacket_max '1232'
	option filter_a '0'
	option confdir '/tmp/dnsmasq.d'
	option rebind_protection '0'
	option filter_aaaa '1'
	option noresolv '1'
	list server '127.0.0.1#3053'
	option localuse '0'

config dhcp 'lan'
	option interface 'lan'
	option start '100'
	option limit '150'
	option leasetime '12h'
	option dhcpv4 'server'
	option force '1'
	list ra_flags 'none'

config dhcp 'wan'
	option interface 'wan'
	option ignore '1'

config dhcp 'guest'
	option interface 'guest'
	option start '100'
	option limit '150'
	option leasetime '12h'
	option dhcpv6 'disabled'
	option ra 'disabled'
	option force '1'
	option ignore '0'

config dhcp 'iot'
	option interface 'iot'
	option start '100'
	option limit '150'
	option leasetime '12h'
	option dhcpv6 'disabled'
	option ra 'disabled'
	option ndp 'disabled'
	option force '1'
	option ignore '0'

config odhcpd 'odhcpd'
	option maindhcp '0'
	option leasefile '/tmp/hosts/odhcpd'
	option leasetrigger '/usr/sbin/odhcpd-update'
	option loglevel '4'

config domain
	option name 'console.gl-inet.com'
	option ip '10.10.10.1'

config domain
	option name 'console.gl-inet.com'
	option ip '::ffff:10.10.10.1'

config dhcp 'secondwan'
	option interface 'secondwan'
	option ignore '1'

config dhcp 'gaming'
	option interface 'gaming'
	option start '100'
	option limit '150'
	option leasetime '12h'
	list ra_flags 'none'

config dhcp 'siem'
	option interface 'siem'
	option start '100'
	option limit '150'
	option leasetime '12h'
	list ra_flags 'none'

config dhcp 'tv'
	option interface 'tv'
	option start '100'
	option limit '150'
	option leasetime '12h'
	list ra_flags 'none'

config dnsmasq 'wgclient1'
	option domainneeded '1'
	option localise_queries '1'
	option rebind_protection '0'
	option boguspriv '0'
	option local '/lan/'
	option domain 'lan'
	option expandhosts '1'
	option cachesize '1000'
	option authoritative '1'
	option readethers '1'
	option resolvfile '/tmp/resolv.conf.d/resolv.conf.wgclient1'
	option ednspacket_max '1232'
	option confdir '/tmp/dnsmasq.d.wgclient1'
	option port '2153'
	option filter_aaaa '1'
	option user 'dnsmasq_vpn'
	list addnhosts '/tmp/hosts.vpn'
	option ignore_hosts_dir '1'
	option noresolv '1'
	option disabled '0'
	list server '127.0.0.1#3053'

